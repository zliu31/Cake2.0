<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake 2.0 - Interactive Cupcakes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .svg-container {
            position: relative;
            width: 100%;
            max-width: 1512px;
            margin: 0 auto;
        }

        #screen1-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Individual cupcake zones */
        .cupcake-zone {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
        }

        .cupcake-zone:hover {
            transform: scale(1.5);
            z-index: 100;
        }

        /* Matchabase - LEFT */
        .matchabase {
            top: 12%;
            left: 11%;
            width: 19%;
            height: 46%;
        }

        .matchabase:hover {
            filter: drop-shadow(0 0 30px #88dd88)
                    drop-shadow(0 0 60px #88dd88)
                    drop-shadow(0 0 90px rgba(136, 221, 136, 0.5))
                    brightness(1.2);
        }

        /* Vanillabase - MIDDLE */
        .vanillabase {
            top: 12%;
            left: 40.5%;
            width: 19%;
            height: 46%;
        }

        .vanillabase:hover {
            filter: drop-shadow(0 0 30px #fff4d4)
                    drop-shadow(0 0 60px #ffee88)
                    drop-shadow(0 0 90px rgba(255, 238, 136, 0.5))
                    brightness(1.2);
        }

        /* Redbase - RIGHT */
        .redbase {
            top: 12%;
            left: 70%;
            width: 19%;
            height: 46%;
        }

        .redbase:hover {
            filter: drop-shadow(0 0 30px #ff6666)
                    drop-shadow(0 0 60px #ff4444)
                    drop-shadow(0 0 90px rgba(255, 68, 68, 0.5))
                    brightness(1.2);
        }

        /* Label tooltip */
        .label {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .label::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 8px solid rgba(0, 0, 0, 0.95);
        }

        .cupcake-zone:hover .label {
            transform: translateX(-50%) scale(1);
        }

        /* Glow ring effect */
        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        .cupcake-zone:hover::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            animation: glowPulse 1.5s ease-in-out infinite;
            pointer-events: none;
        }

        .matchabase:hover::before {
            background: radial-gradient(circle, rgba(136, 221, 136, 0.3) 0%, transparent 70%);
        }

        .vanillabase:hover::before {
            background: radial-gradient(circle, rgba(255, 238, 136, 0.3) 0%, transparent 70%);
        }

        .redbase:hover::before {
            background: radial-gradient(circle, rgba(255, 68, 68, 0.3) 0%, transparent 70%);
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <img id="screen1-svg" src="screen1.svg" alt="Cupcakes">

        <!-- Matchabase - LEFT -->
        <div class="cupcake-zone matchabase" data-flavor="Matcha">
            <div class="label">Matcha Base</div>
        </div>

        <!-- Vanillabase - MIDDLE -->
        <div class="cupcake-zone vanillabase" data-flavor="Vanilla">
            <div class="label">Vanilla Base</div>
        </div>

        <!-- Redbase - RIGHT -->
        <div class="cupcake-zone redbase" data-flavor="Red">
            <div class="label">Red Base</div>
        </div>
    </div>

    <script>
        // Add click interaction
        document.querySelectorAll('.cupcake-zone').forEach(zone => {
            zone.addEventListener('click', function() {
                const flavor = this.dataset.flavor;
                console.log(`Selected: ${flavor} Base`);
            });
        });

        // Smooth entrance animation
        window.addEventListener('load', () => {
            document.querySelectorAll('.cupcake-zone').forEach((zone, index) => {
                setTimeout(() => {
                    zone.style.opacity = '1';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
