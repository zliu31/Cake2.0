<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake 2.0 Interactive Experience</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            position: relative;
            max-width: 100%;
            max-height: 90vh;
        }

        #screen1-svg {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .interactive-area {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: all;
        }

        .interactive-area:hover {
            transform: scale(1.5);
            filter: drop-shadow(0 0 20px currentColor) brightness(1.3);
            z-index: 10;
        }

        /* Red base styling */
        .redbase {
            /* Position these based on your actual SVG coordinates */
            top: 30%;
            left: 20%;
            width: 200px;
            height: 150px;
            color: #ff4444;
        }

        .redbase:hover {
            filter: drop-shadow(0 0 30px #ff4444) brightness(1.5);
        }

        /* Matcha base styling */
        .matchabase {
            top: 30%;
            left: 45%;
            width: 200px;
            height: 150px;
            color: #88cc88;
        }

        .matchabase:hover {
            filter: drop-shadow(0 0 30px #88cc88) brightness(1.5);
        }

        /* Vanilla base styling */
        .vanillabase {
            top: 30%;
            left: 70%;
            width: 200px;
            height: 150px;
            color: #ffee99;
        }

        .vanillabase:hover {
            filter: drop-shadow(0 0 30px #ffee99) brightness(1.5);
        }

        .label {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .interactive-area:hover .label {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="screen1-svg" src="screen1.svg" alt="Screen 1">

        <!-- Interactive overlay areas -->
        <!-- Adjust these positions based on where your elements actually are -->
        <div class="interactive-area redbase" data-name="redbase">
            <div class="label">Red Base</div>
        </div>

        <div class="interactive-area matchabase" data-name="matchabase">
            <div class="label">Matcha Base</div>
        </div>

        <div class="interactive-area vanillabase" data-name="vanillabase">
            <div class="label">Vanilla Base</div>
        </div>
    </div>

    <script>
        // Add click events if needed
        document.querySelectorAll('.interactive-area').forEach(area => {
            area.addEventListener('click', (e) => {
                const name = e.currentTarget.dataset.name;
                console.log(`Clicked on ${name}`);
                // Add any click behavior here
            });
        });

        // Optional: Add keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.interactive-area').forEach(area => {
                    area.style.transform = '';
                    area.style.filter = '';
                });
            }
        });
    </script>
</body>
</html>
